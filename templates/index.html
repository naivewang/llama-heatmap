<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llama Heatmap</title>
<style>
  :root {
    --up: #22c55e; --down: #ef4444; --nodata: #2a2f3a; --bg: #0f1218;
    --card: #171c26; --border: #2a3140; --text: #e5e9f0; --muted: #8b94a7;
    --sw-prefill: #1d4ed8; --sw-gen: #166534; --sw-idle: #495059; --sw-proc: #8b5cf6;
  }
  html[data-theme="light"] {
    --up: #16a34a; --down: #dc2626; --nodata: #d0d7de; --bg: #f6f8fa;
    --card: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #57606a;
    --sw-prefill: #3b82f6; --sw-gen: #16a34a; --sw-idle: #d0d7de; --sw-proc: #b197fc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); padding: 20px; }
  .wrap { max-width: 1045px; margin: 0 auto; }
  .title-row { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  #themeBtn { background: var(--card); border: 1px solid var(--border); color: var(--text);
        font-size: 16px; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .status-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--muted);
         flex: none; box-shadow: 0 0 10px transparent; }
  .dot.up   { background: var(--up);   box-shadow: 0 0 12px var(--up); }
  .dot.down { background: var(--down); box-shadow: 0 0 12px var(--down); }
  .status-text { font-size: 20px; font-weight: 700; }
  /* two label/value pairs per row; .full entries (long model name) span the row */
  .kv { display: grid; grid-template-columns: max-content 1fr max-content 1fr; gap: 4px 14px;
        font-size: 13px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 600; word-break: break-all; }
  .kv .full { grid-column: 1 / -1; display: grid; grid-template-columns: max-content 1fr;
              column-gap: 14px; }
  .slot-badge { display: inline-block; padding: 2px 8px; border-radius: 6px;
        font-size: 12px; border: 1px solid var(--border); margin-left: 6px; }
  .slot-badge.running, .slot-badge.busy, .slot-badge.processing {
    border-color: var(--up); color: var(--up); }
  .slot-badge.error { border-color: var(--down); color: var(--down); }

  .cal-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; font-size: 18px; min-width: 170px; text-align: center; }
  .cal-head button { background: var(--nodata); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .cal-head button:hover { background: #343b4a; }
  html[data-theme="light"] .cal-head button:hover { background: #e2e6ea; }
  .legend { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }

  table.cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.cal th { color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 2px; }
  table.cal td { vertical-align: top; padding: 3px; border: 1px solid var(--border);
        border-radius: 6px; }  /* height follows content (fluid bubbles) */
  td.other { opacity: 0.3; }
  .daynum { font-size: 12px; color: var(--muted); padding: 0 4px 3px; }
  /* column labels for the 6-col hour grid, aligned with the bubbles */
  .hm { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 0 4px 1px;
        font-size: 9px; color: #5a6375; }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
  /* hour bubble: two golden-ratio sub-rectangles (each w:h = 1:1.618) side by side;
     flat inner seam, rounded outer corners only.
     Fluid: each half fills its column share, height follows the golden ratio, so it
     scales down cleanly when the screen narrows (never overlaps). */
  .h { display: grid; grid-template-columns: 1fr 1fr; cursor: pointer;
       border-radius: 3px; overflow: hidden; }
  .h > span { border-radius: 0; aspect-ratio: 1 / 1.618; }
  .h.now { outline: 2px solid #60a5fa; outline-offset: 1px; }

  #dayDetail { display: none; }
  #dayDetail h3 { margin: 0 0 10px; font-size: 15px; }
  #dayDetail .close { float: right; background: none; border: none; color: var(--muted);
        font-size: 16px; cursor: pointer; }
  .min-scroll { overflow-x: auto; padding-bottom: 6px; }
  .min-grid { display: grid; grid-template-columns: 34px repeat(60, 1fr); gap: 2px 1px; min-width: 0; }
  .min-label { font-size: 9px; color: var(--muted); display: flex; align-items: center; }
  /* detail-view minute bubble: SAME outer ratio as the calendar bubble (1.236:1),
     only the split runs top/bottom (top = prefill, bottom = generated) instead of left/right */
  .m { display: grid; grid-template-rows: 1fr 1fr; aspect-ratio: 1.236 / 1;
       border-radius: 2px; overflow: hidden; }
  .m > span { border-radius: 0; }
  .m.now  { outline: 1px solid #60a5fa; outline-offset: -1px; }

  .h.now  { outline: 2px solid #60a5fa; outline-offset: 1px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; }

  /* phones / narrow windows: compact everything, let the banner wrap */
  @media (max-width: 700px) {
    body { padding: 10px; }
    h1 { font-size: 18px; }
    .card { padding: 10px; margin-bottom: 12px; }
    .cal-head { gap: 8px; }
    .cal-head h2 { min-width: 120px; font-size: 15px; }
    .legend { margin-left: 0; gap: 8px 10px; font-size: 11px; }
    .daynum { font-size: 10px; padding: 0 2px 2px; }
    .hm { font-size: 8px; padding: 0 2px 1px; }
    table.cal td { padding: 2px; }
    .kv { font-size: 12px; grid-template-columns: max-content 1fr; }
    .kv .full { grid-column: auto; grid-template-columns: max-content 1fr; }
    .status-text { font-size: 16px; }
    .min-label { font-size: 9px; }  
  }
  #tooltip { position: fixed; background: #000c; color: #fff; font-size: 12px;
        padding: 5px 9px; border-radius: 6px; pointer-events: none; display: none; z-index: 9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row"><h1>🦙 Llama Heatmap</h1><button id="themeBtn" title="Toggle dark/light theme"></button></div>
  <div class="sub">{{ server_url }} &middot; checked every {{ poll_interval }}s &middot; timezone: {{ timezone }}</div>

  <div class="card">
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <div class="status-text" id="statusText">…</div>
      <span id="slots"></span>
    </div>
    <div class="kv" id="details" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button id="prev">‹</button>
      <h2 id="monthLabel"></h2>
      <button id="next">›</button>
      <button id="today">Today</button>
      <span id="monthTotals" style="font-size:12px;color:var(--muted)"></span>
      <div class="legend">
        <span><i style="background:var(--down)"></i>down</span>
        <span><i style="background:var(--sw-prefill)"></i>pp</span>
        <span><i style="background:var(--sw-gen)"></i>tg</span>
        <span><i style="background:var(--sw-idle)"></i>idle</span>
        <span><i style="background:var(--sw-proc)"></i>processing</span>
        <span><i style="background:var(--nodata)"></i>n/a</span>
      </div>
    </div>
    <table class="cal">
      <thead><tr>
        <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
      </tr></thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>

  <div class="card" id="dayDetail">
    <button class="close" id="dayClose">✕</button>
    <h3 id="dayLabel"></h3>
    <div class="min-scroll"><div class="min-grid" id="minGrid"></div></div>
  </div>

  <footer id="footer">loading…</footer>
</div>
<div id="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
let viewYear, viewMonth; // set from server tz on first data load (see init at bottom)
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
let lastData = {};

// GitHub-contribution-style shading: left/top half = prefill (blue), right/bottom = generated (green)
//
// Palette strategy: hand-picked per theme (current). If more themes are ever added,
// consider generating the 5-level ramps instead of hardcoding: per theme store only
// the card background + one anchor color per state, then interpolate lightness in a
// perceptual space (OKLCH / color-mix()) from "near-background" to the anchor —
// optionally stepping until each level meets a WCAG contrast ratio vs. the card.
// Keeps themes consistent with far fewer magic numbers (6 values vs ~16).
const THEMES = {
  dark: {
    GREENS: ["#12291c", "#14532d", "#166534", "#22c55e", "#4ade80"],
    BLUES:  ["#101c30", "#1e3a8a", "#1d4ed8", "#3b82f6", "#60a5fa"],
    GRAY: "#2a2f3a",   // no data (no samples at all)
    LTGRAY: "#495059", // up but 0 tokens (GitHub "level 0")
    RED: "#7f1d1d",    // server down during that interval
    PROC: "#8b5cf6",   // purple: processing (slot busy) but 0 token delta — thinking
  },
  light: {
    GREENS: ["#dcfce7", "#bbf7d0", "#4ade80", "#22c55e", "#15803d"],
    BLUES:  ["#dbeafe", "#bfdbfe", "#93c5fd", "#2563eb", "#1e40af"],
    GRAY: "#b9c2cc",   // no data — darker in light mode for contrast
    LTGRAY: "#eaeef2",
    RED: "#f28b82",
    PROC: "#b197fc",
  },
};
let theme = localStorage.getItem("lh-theme") || "dark";
let C = THEMES[theme];
function applyTheme(t) {
  theme = t;
  C = THEMES[t];
  document.documentElement.dataset.theme = t;
  localStorage.setItem("lh-theme", t);
  $("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
  renderCalendar();
  if (detailParams) showDetail(detailParams.key, detailParams.isToday, detailParams.hour, true);
}
$("themeBtn").onclick = () => applyTheme(theme === "dark" ? "light" : "dark");
function lvl(v, max) {
  if (v == null) return -1;
  if (!max || max <= 0) return v > 0 ? 0 : -1;
  return Math.min(4, Math.floor(Math.sqrt(v / max) * 5));
}
function halves(st, pv, maxP, gv, maxG, busy) {
  if (st === "down") return [C.RED, C.RED];           // hour totally dead
  if (st == null) return [C.GRAY, C.GRAY];            // no samples -> dark grey
  // up: no tokens on either side -> FULL purple if slot was processing
  // that minute (thinking); else light grey (idle);
  // otherwise blue (prefill) / green (generated) by volume
  if ((pv == null || pv <= 0) && (gv == null || gv <= 0)) {
    return busy ? [C.PROC, C.PROC] : [C.LTGRAY, C.LTGRAY];
  }
  const cP = (pv == null || pv <= 0) ? C.LTGRAY : C.BLUES[lvl(pv, maxP)];
  const cG = (gv == null || gv <= 0) ? C.LTGRAY : C.GREENS[lvl(gv, maxG)];
  return [cP, cG];
}
function fmtTok(n) {
  if (n == null) return "–";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(n);
}
// share of prompt tokens served from KV cache (only shown for day/month totals)
function cachePct(cached, processed) {
  const c = cached || 0, t = c + (processed || 0);
  return t > 0 ? ` · cache ${Math.round((100 * c) / t)}%` : "";
}

function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(y, m0, d) { return `${y}-${pad(m0 + 1)}-${pad(d)}`; }

// current date/hour in the SERVER's timezone (Pacific), not the browser's
function serverNow() {
  const tz = lastData.tz || "America/Los_Angeles";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date());
  const g = {};
  parts.forEach(p => g[p.type] = p.value);
  return { y: +g.year, m: +g.month - 1, d: +g.day, h: +g.hour, min: +g.minute };
}

// ------------------------------------------------- status panel
async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const d = await r.json();
    $("dot").className = "dot " + d.status;
    $("statusText").textContent =
      d.status === "unknown" ? "NO DATA YET" :
      d.status === "up" ? "SERVER UP" : "SERVER DOWN";
    const lat = d.latency != null ? ` · ${d.latency.toFixed(0)} ms` : "";
    const when = d.ts ? new Date(d.ts * 1000).toLocaleTimeString() : "";
    $("statusText").title = `last check ${when}${lat}`;
    const dt = $("details");
    const dd = d.details;
    let html = "";
    if (dd) {
      html += `<div class="full"><span>Model</span><b>${dd.model} (${dd.ftype})</b></div>`;
      if (dd.n_ctx)   html += `<span>Context</span><b>${Number(dd.n_ctx).toLocaleString()} tokens</b>`;
      if (dd.total_slots != null) html += `<span>Slots</span><b>${dd.total_slots}</b>`;
      html += `<span>Asleep</span><b>${dd.is_sleeping ? "yes 😴" : "no"}</b>`;
      if (dd.build_info) html += `<span>Build</span><b>llama.cpp ${dd.build_info}</b>`;
    } else {
      html = `<span>Details</span><b>unreachable</b>`;
    }
    dt.innerHTML = html;
    let sh = "";
    if (Array.isArray(d.slots)) {
      sh = d.slots.map(s =>
        `<span class="slot-badge ${s.state}">slot ${s.id}: ${s.state}</span>`).join("");
    }
    $("slots").innerHTML = sh;
  } catch (e) { /* keep last values */ }
}

// ------------------------------------------------- calendar
function renderCalendar() {
  $("monthLabel").textContent = `${MONTHS[viewMonth]} ${viewYear}`;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const firstDow = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7; // Mon=0
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  const now = serverNow();
  const isCurrentMonth = now.y === viewYear && now.m === viewMonth;

  // month-wide maxima for consistent shading across days
  let maxP = 0, maxG = 0;
  for (const k in lastData.prompt_h || {}) for (const v of lastData.prompt_h[k]) if (v != null && v > maxP) maxP = v;
  for (const k in lastData.gen_h || {}) for (const v of lastData.gen_h[k]) if (v != null && v > maxG) maxG = v;
  const mt = lastData.month_totals;
  $("monthTotals").textContent = mt
    ? `month: ↑${fmtTok(mt.prompt)} · ↓${fmtTok(mt.gen)}${cachePct(mt.cached, mt.prompt)}`
    : "";

  const tbody = $("calBody");
  tbody.innerHTML = "";
  for (let w = 0; w < cells.length; w += 7) {
    const tr = document.createElement("tr");
    for (let i = 0; i < 7; i++) {
      const day = cells[w + i];
      const td = document.createElement("td");
      if (day === null) { td.className = "other"; td.innerHTML = "<div class='hours'></div>"; tr.appendChild(td); continue; }
      const key = dateKey(viewYear, viewMonth, day);
      const status = (lastData.cells || {})[key] || [];
      const ph = (lastData.prompt_h || {})[key] || [];
      const gh = (lastData.gen_h || {})[key] || [];
      const isToday = isCurrentMonth && day === now.d;
      const dt = (lastData.day_totals || {})[key];
      td.innerHTML = `<div class="daynum" title="${key} — day total: ↑${fmtTok(dt?.prompt)} · ↓${fmtTok(dt?.gen)}${cachePct(dt?.cached, dt?.prompt)}">${isToday ? "📍 " : ""}${day}</div><div class="hm"><span>0</span><span>6</span><span>12</span><span>18</span><span></span><span></span></div>`;
      const grid = document.createElement("div");
      grid.className = "hours";
      const nowSlot = now.h;
      for (let s = 0; s < 24; s++) {
        const st = status[s] || null;
        const pv = ph[s], gv = gh[s];
        const div = document.createElement("div");
        let cls = "h" + (st ? " " + st : "");
        if (isToday && s === nowSlot) cls += " now";
        div.className = cls;
        const [l, r] = halves(st, pv, maxP, gv, maxG);
        div.innerHTML = `<span style="background:${l}"></span><span style="background:${r}"></span>`;
        div.dataset.tip = `${key} ${pad(s)}:00–${pad(s)}:59 — ` +
          (st === "up" ? "up" : st === "down" ? "DOWN" : "no data") +
          ` · ↑${fmtTok(pv)} · ↓${fmtTok(gv)} · click for per-minute`;
        div.addEventListener("click", (e) => { e.stopPropagation(); showDetail(key, isToday, s); });
        grid.appendChild(div);
      }
      td.appendChild(grid);
      td.addEventListener("click", () => showDetail(key, isToday, null));
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

// ------------------------------------- per-minute detail view (day or single hour)
let shownDetail = null;
let detailParams = null;  // {key, isToday, hour} of the open detail, for auto-refresh
async function showDetail(key, isToday, hour, force) {
  const tag = hour == null ? key : `${key}:${hour}`;
  if (!force && shownDetail === tag) { hideDay(); return; }
  shownDetail = tag;
  detailParams = { key, isToday, hour };
  const r = await fetch(`/api/day?date=${key}`);
  if (!r.ok) return;
  const d = await r.json();
  if (shownDetail !== tag) return; // stale response
  $("dayDetail").style.display = "block";
  const now = serverNow(); // server tz, not the viewer's browser tz
  const nowMin = isToday ? now.h * 60 + now.min : -1;
  const start = hour == null ? 0 : hour * 60;
  const end = hour == null ? 1440 : start + 60;
  let totP = 0, totG = 0, maxP = 0, maxG = 0;
  for (let i = start; i < end; i++) {
    if (d.prompt_min[i] != null) { totP += d.prompt_min[i]; maxP = Math.max(maxP, d.prompt_min[i]); }
    if (d.gen_min[i] != null) { totG += d.gen_min[i]; maxG = Math.max(maxG, d.gen_min[i]); }
  }
  $("dayLabel").textContent = (hour == null
    ? `${key} — per minute (${d.tz}) · day total: `
    : `${key} ${pad(hour)}:00–${pad(hour)}:59 — per minute (${d.tz}) · hour total: `) +
    `↑${fmtTok(totP)} · ↓${fmtTok(totG)}` + (hour == null ? cachePct(d.totals?.cached, totP) : "");
  const grid = $("minGrid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (let h = hour == null ? 0 : hour; h <= (hour == null ? 23 : hour); h++) {
    const lab = document.createElement("div");
    lab.className = "min-label";
    lab.textContent = pad(h) + ":00";
    frag.appendChild(lab);
    for (let m = 0; m < 60; m++) {
      const idx = h * 60 + m;
      const st = d.cells[idx];
      const pv = d.prompt_min[idx], gv = d.gen_min[idx];
      const div = document.createElement("div");
      const busy = d.busy_min ? d.busy_min[idx] : null;
      div.className = "m" + (st ? " " + st : "") + (idx === nowMin ? " now" : "");
      const [l, r] = halves(st, pv, maxP, gv, maxG, busy);
      div.innerHTML = `<span style="background:${l}"></span><span style="background:${r}"></span>`;
      div.title = `${pad(h)}:${pad(m)} — ` + (st === "up" ? "up" : st === "down" ? "DOWN" : "no data") +
        ` · ↑${fmtTok(pv)} · ↓${fmtTok(gv)}` +
        (busy ? " · processing" : "");
      frag.appendChild(div);
    }
  }
  grid.appendChild(frag);
  $("dayDetail").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function hideDay() {
  shownDetail = null;
  detailParams = null;
  $("dayDetail").style.display = "none";
}
$("dayClose").onclick = hideDay;

async function refreshCalendar() {
  try {
    const r = await fetch(`/api/calendar?year=${viewYear}&month=${viewMonth + 1}`);
    lastData = await r.json();
  } catch (e) { return; }
  renderCalendar();
  const t = new Date().toLocaleTimeString();
  $("footer").textContent = `calendar for ${MONTHS[viewMonth]} ${viewYear} · refreshed ${t} · auto-refresh every 59s`;
}

$("prev").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } refreshCalendar(); };
$("next").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } refreshCalendar(); };
$("today").onclick = () => { const n = serverNow(); viewYear = n.y; viewMonth = n.m; refreshCalendar(); };

// tooltip
const tip = $("tooltip");
document.addEventListener("mousemove", (e) => {
  const t = e.target.closest && e.target.closest(".h[data-tip]");
  if (t) { tip.style.display = "block"; tip.textContent = t.dataset.tip;
           tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
  else tip.style.display = "none";
});

(async function init() {
  // pick the initial month from the SERVER's timezone so every viewer
  // (any browser timezone) lands on the same month
  try {
    const r = await fetch("/api/status");
    const s = await r.json();
    const tz = s.tz || "America/Los_Angeles";
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: tz,
      year: "numeric", month: "2-digit" }).formatToParts(new Date());
    const g = {};
    parts.forEach(p => g[p.type] = p.value);
    viewYear = +g.year; viewMonth = +g.month - 1;
  } catch (e) {
    const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth();
  }
  applyTheme(theme);
  refreshStatus();
  refreshCalendar();
})();
setInterval(() => {
  refreshStatus(); refreshCalendar();
  if (detailParams) showDetail(detailParams.key, detailParams.isToday, detailParams.hour, true); // keep open detail fresh
}, 59000); // 59s: deliberately off the backend's 60s poll cadence to avoid resonance
</script>
